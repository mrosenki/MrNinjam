name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
          - platform: macOS
            os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch locked source dependencies
        shell: bash
        run: ./scripts/fetch_dependencies.sh

      - name: Install Ubuntu dependencies
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          PACKAGES=(
            libogg-dev libvorbis-dev
            mesa-common-dev libx11-dev libxrandr-dev libxinerama-dev
            libxcursor-dev libxcomposite-dev libglib2.0-0
            libfontconfig1-dev mesa-vulkan-drivers libvulkan1
            vulkan-tools vulkan-validationlayers
          )
          sudo apt-get install -y "${PACKAGES[@]}"

      - name: Install macOS codec dependencies
        if: matrix.os == 'macos-latest'
        shell: bash
        run: brew install libogg libvorbis

      - name: Bootstrap pinned vcpkg
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          git clone --no-checkout https://github.com/microsoft/vcpkg.git tools/vcpkg
          git -C tools/vcpkg checkout --detach afa249f12f52ed8a3b919f195495ba8b330288d1
          ./tools/vcpkg/bootstrap-vcpkg.bat

      - name: Install Windows codec dependencies
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          VCPKG_ROOT: ${{ github.workspace }}/tools/vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows-static
          VCPKG_FEATURE_FLAGS: manifests
        run: ./tools/vcpkg/vcpkg install --triplet x64-windows-static

      - name: Configure Release build
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/tools/vcpkg/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=x64-windows-static \
              -DMRNINJAM_BUILD_UI_HARNESS=ON
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
              -DMRNINJAM_BUILD_UI_HARNESS=ON
          fi

      - name: Build plugins
        shell: bash
        run: cmake --build build --config Release --parallel 4

      - name: Run CTest
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify packaged formats
        shell: bash
        run: |
          STEM='MrNinjam'
          find build/plugin -name "$STEM.clap" -print -quit | grep .
          find build/plugin -name "$STEM.vst3" -print -quit | grep .

      - name: Reject source paths in packaged files
        shell: bash
        run: |
          while IFS= read -r packaged_file; do
            cmake -DARTIFACT="$packaged_file" \
              -D"FORBIDDEN_PATHS=$GITHUB_WORKSPACE" \
              -P scripts/check_artifact_paths.cmake
          done < <(find build/plugin -type f)

      - name: Build Steinberg VST3 validator
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: cmake --build build --config Release --target vst3_validator --parallel 4

      - name: Validate VST3 artifact
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          VST3_PATH="$(find build/plugin -name 'MrNinjam.vst3' | head -n 1)"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            VALIDATOR="$(find build/validator-build -type f -iname 'validator.exe' | head -n 1)"
          else
            VALIDATOR="$(find build/validator-build -type f -name 'validator' | head -n 1)"
          fi
          test -n "$VALIDATOR"
          "$VALIDATOR" "$VST3_PATH"

      - name: Re-check locked dependencies
        shell: bash
        run: ./scripts/check_submodule_clean.sh

      - name: Stage Windows test package
        if: matrix.os == 'windows-latest'
        id: windows-package
        shell: pwsh
        run: |
          $VersionMatch = Select-String -Path CMakeLists.txt `
            -Pattern 'project\(MrNinjam VERSION ([0-9]+\.[0-9]+\.[0-9]+)'
          if (-not $VersionMatch) {
            throw 'Could not read the MrNinjam version from CMakeLists.txt.'
          }
          $Version = $VersionMatch.Matches[0].Groups[1].Value
          "version=$Version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          $Clap = Get-ChildItem -Path build/plugin -Recurse `
            -Filter MrNinjam.clap | Select-Object -First 1
          $Vst3 = Get-ChildItem -Path build/plugin -Recurse `
            -Filter MrNinjam.vst3 | Select-Object -First 1
          if (-not $Clap -or -not $Vst3) {
            throw 'Validated Windows CLAP and VST3 bundles were not both found.'
          }

          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item -LiteralPath $Clap.FullName -Destination package -Recurse
          Copy-Item -LiteralPath $Vst3.FullName -Destination package -Recurse
          Copy-Item -LiteralPath docs/WINDOWS_TEST_BUILD.md `
            -Destination package/INSTALL.md

      - name: Upload Windows test package
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MrNinjam-${{ steps.windows-package.outputs.version }}-Windows-x64-test-${{ github.run_number }}
          path: package
          if-no-files-found: error
          retention-days: 30
